<section id="quiz-play" class="quiz-panel" hidden>

</button>
</form>

</button>

</button>
</div>
<div class="quiz-bottom">
<button id="quiz-end" type="button" class="text-button">

</button>
<button id="quiz-next" type="button" class="button" disabled>

</p>

</button>
<button type="button" id="quiz-new" class="button secondary">

</button>
</div>
<div id="quiz-review">

</div>
