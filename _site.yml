name: "french-study"
output_dir: "docs"
include: ["assets"]
exclude: ["README.md", "build.R", "build_search.py", "review", "tests", "package.json", "node_modules"]
output:
  html_document:
    theme: null
    highlight: null
    mathjax: null
    self_contained: false
    pandoc_args: ["--metadata=lang:en"]
    includes:
      in_header: assets/head.html
      before_body: assets/header.html
      after_body: assets/footer.html
